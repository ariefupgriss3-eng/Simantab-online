name: Build SIMANTAB Android AAB

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-aab.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create permanent upload key for this build
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore simantab-upload-key.jks \
            -storepass 'Simantab2026!' \
            -keypass 'Simantab2026!' \
            -alias simantab \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=SIMANTAB, OU=Disdikbud Batang, O=Disdikbud Kabupaten Batang, L=Batang, ST=Jawa Tengah, C=ID'
          cat > UPLOAD-KEY-README.txt <<'EOF'
          SIMANTAB Android Upload Key
          Alias: simantab
          Keystore password: Simantab2026!
          Key password: Simantab2026!
          PENTING: Simpan file simantab-upload-key.jks secara aman. Gunakan key yang sama untuk update aplikasi berikutnya di Google Play Console.
          EOF

      - name: Build signed release AAB
        working-directory: android
        env:
          SIMANTAB_KEYSTORE_PASSWORD: 'Simantab2026!'
          SIMANTAB_KEY_ALIAS: simantab
          SIMANTAB_KEY_PASSWORD: 'Simantab2026!'
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB and upload key
        uses: actions/upload-artifact@v4
        with:
          name: SIMANTAB-Android-Release
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/simantab-upload-key.jks
            android/app/UPLOAD-KEY-README.txt
