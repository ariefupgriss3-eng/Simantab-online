name: Build SIMANTAB Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android signing secrets
        shell: bash
        env:
          SIMANTAB_KEYSTORE_B64: ${{ secrets.SIMANTAB_KEYSTORE_B64 }}
          SIMANTAB_KEYSTORE_PASSWORD: ${{ secrets.SIMANTAB_KEYSTORE_PASSWORD }}
          SIMANTAB_KEY_ALIAS: ${{ secrets.SIMANTAB_KEY_ALIAS }}
          SIMANTAB_KEY_PASSWORD: ${{ secrets.SIMANTAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SIMANTAB_KEYSTORE_B64 \
            SIMANTAB_KEYSTORE_PASSWORD \
            SIMANTAB_KEY_ALIAS \
            SIMANTAB_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions Secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore permanent upload keystore
        working-directory: android/app
        shell: bash
        env:
          SIMANTAB_KEYSTORE_B64: ${{ secrets.SIMANTAB_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIMANTAB_KEYSTORE_B64" | base64 --decode > simantab-upload-key.jks
          test -s simantab-upload-key.jks
          chmod 600 simantab-upload-key.jks

      - name: Build signed release AAB
        working-directory: android
        env:
          SIMANTAB_KEYSTORE_PASSWORD: ${{ secrets.SIMANTAB_KEYSTORE_PASSWORD }}
          SIMANTAB_KEY_ALIAS: ${{ secrets.SIMANTAB_KEY_ALIAS }}
          SIMANTAB_KEY_PASSWORD: ${{ secrets.SIMANTAB_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Verify signed AAB
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify -strict "$AAB"

      - name: Upload signed AAB only
        uses: actions/upload-artifact@v4
        with:
          name: SIMANTAB-Android-Release
          if-no-files-found: error
          retention-days: 30
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove restored keystore
        if: always()
        working-directory: android/app
        shell: bash
        run: rm -f simantab-upload-key.jks
