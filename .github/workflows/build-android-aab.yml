name: Build SIMANTAB Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          SIMANTAB_KEYSTORE_B64: ${{ secrets.SIMANTAB_KEYSTORE_B64 }}
          SIMANTAB_KEYSTORE_PASSWORD: ${{ secrets.SIMANTAB_KEYSTORE_PASSWORD }}
          SIMANTAB_KEY_ALIAS: ${{ secrets.SIMANTAB_KEY_ALIAS }}
          SIMANTAB_KEY_PASSWORD: ${{ secrets.SIMANTAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIMANTAB_KEYSTORE_B64 SIMANTAB_KEYSTORE_PASSWORD SIMANTAB_KEY_ALIAS SIMANTAB_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Restore upload keystore securely
        working-directory: android/app
        env:
          SIMANTAB_KEYSTORE_B64: ${{ secrets.SIMANTAB_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIMANTAB_KEYSTORE_B64" | base64 --decode > simantab-upload-key.jks
          chmod 600 simantab-upload-key.jks

      - name: Build signed release AAB
        working-directory: android
        env:
          SIMANTAB_KEYSTORE_PASSWORD: ${{ secrets.SIMANTAB_KEYSTORE_PASSWORD }}
          SIMANTAB_KEY_ALIAS: ${{ secrets.SIMANTAB_KEY_ALIAS }}
          SIMANTAB_KEY_PASSWORD: ${{ secrets.SIMANTAB_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Remove keystore from runner
        if: always()
        working-directory: android/app
        run: rm -f simantab-upload-key.jks

      - name: Upload AAB only
        uses: actions/upload-artifact@v4
        with:
          name: SIMANTAB-Android-Release
          if-no-files-found: error
          retention-days: 7
          path: android/app/build/outputs/bundle/release/app-release.aab
