name: SIMANTAB registration contract
on:
  push:
    branches:
      - feature/cf-registration-unit-asn-nip-from-active-20261014
  pull_request:
    paths:
      - web/registration-ui-final.js
      - web/finalize-html.mjs
      - web/mandatory-personnel-profile.js
      - web/ks-needs-onboarding.js
      - web/tests/cloudflare-mandatory-personnel-profile.test.cjs
      - web/smart-upload-recovery.js
      - web/jabfung-jenjang-enhancement.js
      - web/kp-enhancement.js
      - web/cuti-requirements.js
      - web/cloudflare/harden-gtk-submission.mjs
      - web/cloudflare/postbuild.mjs
      - web/tests/cloudflare-smart-upload-recovery.test.cjs
      - web/jabfung-document-revisions.js
      - web/tests/cloudflare-jabfung-document-revisions.test.cjs
      - supabase/migrations/20261015162000_jabfung_document_revision_workflow.sql
      - web/tests/registration-contract.test.mjs
      - supabase/functions/simantab-register-pending/index.ts
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax and registration rules
        run: |
          node web/tests/registration-contract.test.mjs
          node web/tests/registration-backend.test.mjs
          node --test web/tests/cloudflare-mandatory-personnel-profile.test.cjs
          node --test web/tests/cloudflare-jabfung-document-revisions.test.cjs
          node --test web/tests/cloudflare-smart-upload-recovery.test.cjs
      - name: Cloudflare static build smoke test
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build:cloudflare
