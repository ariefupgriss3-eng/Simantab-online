name: Jabfung free local OCR QA
on:
  pull_request:
    paths:
      - 'web/jabfung-free-verifier-core.mjs'
      - 'web/jabfung-free-verifier-ui.mjs'
      - 'web/jabfung-jenjang-enhancement.js'
      - 'web/build.mjs'
      - 'web/finalize-html.mjs'
      - 'web/package.json'
      - 'web/vendor-jabfung-ocr.mjs'
      - 'web/jabfung-ai-read-edge.js'
      - 'supabase/functions/simantab-jabfung-ai-workflow/index.ts'
      - 'web/tests/jabfung-free-verifier.test.mjs'
      - 'web/tests/jabfung-free-browser-smoke.test.mjs'
      - '.github/workflows/jabfung-free-local-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-ocr-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check frontend (no paid APIs)
        run: |
          node --check web/jabfung-free-verifier-core.mjs
          node --check web/jabfung-free-verifier-ui.mjs
          node --check web/jabfung-jenjang-enhancement.js
          node --check web/jabfung-ai-read-edge.js
          node --check web/finalize-html.mjs
      - name: Test free local rules
        run: node --test web/tests/jabfung-free-verifier.test.mjs
      - name: Verify self-hosted OCR asset packaging from pinned npm packages
        run: |
          cd web
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p .vercel/output/static
          node vendor-jabfung-ocr.mjs
          test -s .vercel/output/static/ocr/pdf.mjs
          test -s .vercel/output/static/ocr/pdf.worker.mjs
          test -s .vercel/output/static/ocr/tesseract.esm.min.js
          test -s .vercel/output/static/ocr/tesseract.worker.min.js
          test -s .vercel/output/static/ocr/lang/eng.traineddata.gz
          test -s .vercel/output/static/ocr/lang/ind.traineddata.gz
      - name: Chromium PDF and Android-size synthetic OCR test (no remote network)
        run: |
          cd web
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          node --test tests/jabfung-free-browser-smoke.test.mjs
