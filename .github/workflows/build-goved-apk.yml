name: Build GovEd Meeting AI APK

on:
  push:
    branches:
      - goved-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: goved-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: cp goved-android/app/build/outputs/apk/debug/app-debug.apk GovEd-Meeting-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GovEd-Meeting-AI-APK
          path: GovEd-Meeting-AI.apk
          if-no-files-found: error
          retention-days: 30
