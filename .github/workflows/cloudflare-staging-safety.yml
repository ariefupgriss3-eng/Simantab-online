name: SIMANTAB Cloudflare Staging Safety Checks

on:
  push:
    branches:
      - migration/cloudflare-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check web/secure-build.mjs
          node --check web/cloudflare-staging/snapshot-source.mjs
          node --check web/cloudflare-staging/worker.mjs
          node --check web/cloudflare-staging/mock-api.mjs
          node --check web/cloudflare-staging/auth-boundary.mjs
          node --check web/cloudflare-staging/supabase-auth-readonly.mjs
          node --check web/cloudflare-staging/auth-integration-gate.mjs
          node --check web/cloudflare-staging/offline-asset-audit.mjs
          node --check web/cloudflare-staging/copy-icon.mjs
          node --check web/telemetry-delivery.mjs
          node --check web/bcks-substansi-simulator-v5.js
      - name: Test staging worker and source isolation
        run: |
          node --test web/cloudflare-staging/worker.test.mjs web/cloudflare-staging/mock-api.test.mjs web/cloudflare-staging/auth-boundary.test.mjs web/cloudflare-staging/supabase-auth-readonly.test.mjs web/cloudflare-staging/auth-integration-gate.test.mjs web/cloudflare-staging/snapshot-source.test.mjs web/cloudflare-staging/offline-asset-audit.test.mjs web/cloudflare-staging/copy-icon.test.mjs web/cloudflare-staging/pwa-build-smoke.test.mjs
      - name: Run telemetry regression suite
        run: node --test web/telemetry-delivery.test.mjs
      - name: Ensure no production fetch without an audited local snapshot
        shell: bash
        run: |
          cd web
          if SIMANTAB_CLOUDFLARE_STAGING=1 node secure-build.mjs > /tmp/simantab-staging-log 2>&1; then
            echo "ERROR: Staging build must refuse to run without a snapshot"
            exit 1
          fi
          if ! grep -q "Snapshot SIMANTAB untuk Cloudflare belum diberikan" /tmp/simantab-staging-log; then
            echo "ERROR: Missing-snapshot refusal has changed unexpectedly"
            exit 1
          fi
          echo "PASS: Staging build refuses a missing local snapshot"
      - name: Package public staging source for isolated local build
        uses: actions/upload-artifact@v4
        with:
          name: simantab-public-source-only
          path: web/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
      - name: Prepare public dependency bundle for isolated build
        if: contains(github.event.head_commit.message, '[offline-vendor-bundle]')
        shell: bash
        run: |
          cd web
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          mkdir -p staging-vendor-dist
          cp node_modules/jspdf/dist/jspdf.umd.min.js staging-vendor-dist/
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js staging-vendor-dist/
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const urls=[
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
            'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
          ];
          let installed=false;
          for(const url of urls){
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(18000)});
              if(!response.ok)continue;
              const code=await response.text();
              if(code.length<10000||!code.includes('createClient'))continue;
              await fs.writeFile('staging-vendor-dist/supabase-local.js',code);
              installed=true;
              break;
            }catch{}
          }
          if(!installed)throw new Error('Cannot retrieve public Supabase browser bundle');
          NODE
      - name: Downloadable public dependencies for private offline test
        if: contains(github.event.head_commit.message, '[offline-vendor-bundle]')
        uses: actions/upload-artifact@v4
        with:
          name: simantab-public-vendor-bundle
          path: web/staging-vendor-dist/
          if-no-files-found: error
          retention-days: 1
